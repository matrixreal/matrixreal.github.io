<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cube Away</title>
<style>
:root{--bg:#b7cce9;--bar:#dde4f7;--navy:#1a225a;--ink:#1d2c3f;--blue:#1c4ea3;--heart:#ff4941;--btn:#dbe5f6;--green:#4cc24c}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none}
#bar{position:fixed;top:0;left:0;right:0;box-sizing:border-box;height:calc(46px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0 26px;display:flex;align-items:center;justify-content:space-between;background:var(--bar);border-radius:0 0 22px 22px;box-shadow:0 2px 0 rgba(255,255,255,.5) inset}
#title{font-weight:800;font-size:16px;color:var(--ink);width:90px}
#hearts{display:flex;gap:4px}
#hearts svg{width:24px;height:24px;fill:var(--heart);transition:fill .2s,transform .2s}
#hearts svg.off{fill:#b9c5de;transform:scale(.85)}
#gear{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
#gear svg{width:26px;height:26px;fill:var(--navy)}
#count{position:fixed;top:calc(46px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:3px 16px 5px;background:var(--bar);border-radius:0 0 16px 16px;color:var(--ink);font-weight:800;font-size:17px;pointer-events:none}
#count svg{width:15px;height:15px;fill:var(--blue)}
#hint{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:var(--btn);padding:0;cursor:pointer;box-shadow:0 4px 10px rgba(26,34,90,.18)}
#hint svg{width:34px;height:34px}
#hint:active{transform:translateX(-50%) scale(.94)}
#hint.off{opacity:.5;filter:grayscale(.6)}
#reset{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);border:0;border-radius:16px;background:var(--bar);color:var(--navy);font-family:inherit;font-weight:700;font-size:13px;padding:7px 16px;cursor:pointer;opacity:.85}
#count.pulse{animation:pulse .3s ease-out}
@keyframes pulse{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.3)}100%{transform:translateX(-50%) scale(1)}}
#badge{position:absolute;right:-6px;bottom:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--green);border:2px solid #fff;box-sizing:border-box;color:#fff;font-size:12px;font-weight:800;line-height:16px;text-align:center}
#ver{position:fixed;left:10px;bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:11px;color:#7e95c0;pointer-events:none}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(183,204,233,.78);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility 0s .25s}
.ov.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s}
.card{text-align:center;background:var(--bar);padding:26px 34px;border-radius:22px;box-shadow:0 8px 28px rgba(26,34,90,.22)}
.card h2{margin:0 0 16px;font-size:22px;color:var(--ink)}
.card button{display:block;width:100%;margin-top:10px;border:0;border-radius:24px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;font-family:inherit;padding:12px 34px;cursor:pointer}
.card button.alt{background:#fff;color:var(--blue)}
body.neon{--bg:#070714;--bar:#12142e;--navy:#18e4ff;--ink:#e8f6ff;--blue:#18e4ff;--heart:#ff2a6d;--btn:#14183a;--green:#39ff14}
body.neon #bar{box-shadow:0 2px 16px rgba(24,228,255,.35)}
body.neon #hearts svg{filter:drop-shadow(0 0 5px #ff2a6d)}
body.neon #hearts svg.off{fill:#2a2f55;filter:none}
body.neon #hint{border-color:#18e4ff;box-shadow:0 0 16px rgba(24,228,255,.55)}
body.neon #count{box-shadow:0 2px 14px rgba(24,228,255,.3)}
body.neon .ov{background:rgba(7,7,20,.82)}
body.neon .card{box-shadow:0 0 24px rgba(24,228,255,.4)}
body.neon .card button{color:#070714}
body.neon .card button.alt{background:transparent;border:1px solid #18e4ff;color:#18e4ff}
body.neon #ver{color:#3a4380}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
#reset,#ver{z-index:6}
:root{--hbg:#d6f1de;--hcard1:#6fbef7;--hcard2:#0681f0;--hpill:#44a3f3;--hbar:#9eb8e9;--coin:#6882df;--play:#5265de;--logo:#6e9390}
body.neon{--hbg:#070714;--hcard1:#7a3cff;--hcard2:#18a8ff;--hpill:rgba(255,255,255,.2);--hbar:#12142e;--coin:#2a2f6a;--play:#3a4bff;--logo:#18e4ff}
/* ---- page d'accueil ---- */
#home{position:fixed;inset:0;z-index:5;display:none;background:var(--hbg);overflow:hidden}
body.home #home{display:block}
body.home #bar,body.home #count,body.home #hint{display:none}
#homeIn{position:relative;box-sizing:border-box;width:100%;max-width:560px;height:100%;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(70px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center}

#daily{margin-top:clamp(12px,4vh,48px);width:clamp(140px,36vw,190px);box-sizing:border-box;padding:clamp(10px,1.8vh,16px) 10px 12px;border-radius:20px;cursor:pointer;background:linear-gradient(var(--hcard1),var(--hcard2));color:#fff;text-align:center;box-shadow:0 6px 16px rgba(6,129,240,.28)}
body.neon #daily{box-shadow:0 0 22px rgba(122,60,255,.55)}
#dIcon{position:relative;width:clamp(44px,12vw,56px);height:clamp(44px,12vw,56px);margin:0 auto 6px;border-radius:50%;background:#dbe5f6;border:3px solid #fff;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
#dIcon svg{width:60%;height:60%}
#dPlus{position:absolute;right:-7px;bottom:-3px;min-width:22px;height:18px;padding:0 3px;box-sizing:border-box;border-radius:10px;background:#36ba36;border:2px solid #fff;font-size:11px;font-weight:800;line-height:14px}
#dTitle{font-weight:800;font-size:clamp(14px,3.8vw,18px)}
#dDate{font-weight:700;font-size:clamp(12px,3.2vw,14px);margin-top:3px}
#dDiff{font-size:11px;opacity:.9;margin-top:2px;letter-spacing:.5px}
#dailyPlay{margin-top:9px;border:0;border-radius:20px;background:var(--hpill);color:#fff;font-family:inherit;font-weight:800;font-size:clamp(13px,3.5vw,15px);padding:6px 20px;cursor:pointer}
#dailyPlay.done{opacity:.75}
#logo{flex:1;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;min-height:0}
#logoText{font-weight:900;font-size:clamp(34px,11vw,64px);color:var(--logo);letter-spacing:-1px;line-height:1.05}
body.neon #logoText{text-shadow:0 0 12px #18e4ff,0 0 30px rgba(24,228,255,.55)}
#logoImg{max-width:82%;max-height:100%;object-fit:contain}
#progress{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:clamp(7px,1.3vh,11px) 12px;border-radius:22px;background:var(--hbar)}
body.neon #progress{border:1px solid rgba(24,228,255,.35);box-shadow:0 0 18px rgba(24,228,255,.18) inset}
#coins{display:flex;flex:1;justify-content:space-around;align-items:center}
.coin{width:clamp(25px,6.8vw,34px);height:clamp(25px,6.8vw,34px);border-radius:50%;background:var(--coin);color:#fff;font-weight:800;font-size:clamp(12px,3.3vw,16px);display:flex;align-items:center;justify-content:center}
.coin.cur{background:radial-gradient(circle at 35% 30%,#ffd04d,#ff9d06);transform:scale(1.12);box-shadow:0 3px 8px rgba(255,157,6,.55)}
.coin.done{background:#3fbf5a}
#gift{border:0;background:none;padding:0;width:clamp(32px,8.4vw,42px);cursor:pointer;margin-left:4px}

@keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
#play{margin-top:clamp(10px,1.8vh,16px);width:70%;height:clamp(44px,6.4vh,54px);border:0;border-radius:18px;background:var(--play);color:#fff;font-family:inherit;font-weight:800;font-size:clamp(19px,5.4vw,25px);cursor:pointer}
body.neon #play{box-shadow:0 0 20px rgba(58,75,255,.65)}
#play:active,#dailyPlay:active{transform:scale(.97)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:rgba(26,34,90,.93);color:#fff;padding:10px 18px;border-radius:18px;font-weight:700;font-size:14px;text-align:center;max-width:82vw;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%)}
.card p{margin:0 0 12px;color:var(--ink);font-weight:700}
.card.wide{width:min(86vw,360px);box-sizing:border-box}

.card input{width:100%;box-sizing:border-box;margin:10px 0 0;padding:10px 14px;border:2px solid var(--blue);border-radius:14px;background:#fff;font-size:16px;font-weight:700;text-align:center;color:#1d2c3f;outline:none}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.card .opt{width:46px;height:46px;border:0;border-radius:50%;padding:0;margin:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.opt.sel{outline:3px solid var(--blue);outline-offset:2px}
body.neon .card input{background:#0b0d22;color:#e8f6ff}
#avatarBtn{position:relative}
.card.sc{max-height:88vh;overflow:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-weight:800;font-size:14px;color:var(--ink)}
.card input[type=range]{width:55%;margin:0;padding:0;border:0;background:none;accent-color:var(--blue)}
#wStars{font-size:46px;letter-spacing:6px;margin:4px 0 10px}
#wStars span{display:inline-block;color:#cfd8ea}
#wStars span.on{color:#ffc61a;text-shadow:0 2px 0 #e69a00;transform:scale(0);animation:starpop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
#wStats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
#wStats div{background:#fff;border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;font-size:13px;color:#6b7a99}

body.neon #wStats div{background:#0b0d22}
#wprogress{display:flex;justify-content:space-around;align-items:center;gap:4px;background:var(--hbar);border-radius:20px;padding:8px 10px;margin-bottom:6px}
#wprogress .coin{animation:coinin .35s both}
.gf{width:34px;display:inline-block}.gf svg{display:block;width:100%}.gf.near{animation:bob 1.1s ease-in-out infinite}
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#conf i{position:absolute;top:-16px;width:8px;height:14px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shk .3s}
#logoImg,#logoText{animation:flt 3.5s ease-in-out infinite}

#tuto{position:fixed;left:50%;top:calc(110px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:80vw;background:rgba(26,34,90,.92);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:16px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#tuto.show{opacity:1}body.home #tuto{display:none}

<script>
(() => {
  const $ = id => document.getElementById(id);
  // Logo du jeu : chemin de ton PNG (remplace simplement logo.png par ton image). Si le fichier est absent, le texte « Amaze Cube » s'affiche.
  const LOGO_SRC = 'logo.png';
  let screen = 'home', mode = 'level', daily = null;
  let level = 1;
  try { level = parseInt(localStorage.getItem('cubeaway_level')) || 1; } catch (e) {}

  // Réglages : distance caméra (plus grand = cube plus petit), vitesses, couleurs
  const CFG = { camDist: 3.31, exitBase: 14, exitAccel: 5.25, bumpFwd: 18.3, bumpBack: 14.2 };
  const THEMES = {
    light: { bg: 0xb7cce9, tile: '#f9f9fb', line: '#e6e8f1', path: 0x1c4ea3, bad: 0xff4941, hint: 0x239c31, edge: 0x8ea6d3,

    neon:  { bg: 0x070714, tile: '#0d0f24', line: '#232a63', path: 0x18e4ff, bad: 0xff2b2b, hint: 0x39ff14, edge: 0xd7e6ff,
             base: [0xff5c8a, 0xff6ec7, 0xff2bd6, 0xff9a1f, 0xa6e022, 0xaaff00, 0x1ee6ff, 0x35b6ff, 0x3d7bff,
             0xa855f7, 0x9d4dff, 0x6a4cff, 0xc58bff, 0x19e6c1, 0xff6a00], exit: [0xffe600] }
  };
  let theme = 'light', edgeMat = null;
  
  const COL = { path: 0, bad: 0, hint: 0, exit: [], base: null };
  const pickBase = () => COL.base ? COL.base[Math.floor(Math.random() * COL.base.length)] : COL.path;
  const SW = 0.2, FLAT = 0.03, OFF = 0.03, ARR_L = 0.48, ARR_W = 0.31;

  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0xb7cce9);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
  const cube = new THREE.Group();
  scene.add(cube);

  const V = a => new THREE.Vector3(a[0], a[1], a[2]);
  const FACES = [
    { n: [0, 0, 1],  u: [1, 0, 0],  v: [0, 1, 0] },
    { n: [0, 0, -1], u: [-1, 0, 0], v: [0, 1, 0] },
    { n: [1, 0, 0],  u: [0, 0, -1], v: [0, 1, 0] },
    { n: [-1, 0, 0], u: [0, 0, 1],  v: [0, 1, 0] },
    { n: [0, 1, 0],  u: [1, 0, 0],  v: [0, 0, -1] },
    { n: [0, -1, 0], u: [1, 0, 0],  v: [0, 0, 1] }
  ].map(f => ({ n: V(f.n), u: V(f.u), v: V(f.v) }));
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  let DX = 3, DY = 3, DZ = 3;
  const dimOf = v => Math.abs(v.x) * DX + Math.abs(v.y) * DY + Math.abs(v.z) * DZ;
  const MU = f => dimOf(f.u) - 1, MV = f => dimOf(f.v) - 1;
  function shapeFor(L, n) {
    if (L < 8) return [n, n, n];
    const k = (L - 8) % 5, c = v => Math.max(4, Math.min(12, v));
    return k === 0 ? [n, c(n - 2), c(n - 3)] : k === 2 ? [c(n - 3), c(n - 3), c(n + 2)] : k === 4 ? [n, n, c(n - 4)] : [n, n, n];
  }
  let N = 3, M = 2, hits = [], all = [], moving = [], bumping = [], occ = [], shell = null, flashing = [];
  let remaining = 0, won = false, failed = false, lives = 3, hints = 2, hintObj = null, hintTm = 0;
  try { const h = parseInt(localStorage.getItem('cubeaway_hints')); if (!isNaN(h)) hints = h; } catch (e) {}

  // ---------- effets, sons, vibrations ----------
  let fx = [], AC = null, soundOn = true, vibOn = true;
  let O = { bloom: 0, theme: 'auto', lang: (navigator.language || 'fr').slice(0, 2) === 'fr' ? 'fr' : 'en', mus: 50, sfx: 100, sens: 100, inv: 0, cb: 0, rm: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 0, zen: 0 };
  try { Object.assign(O, JSON.parse(localStorage.getItem('cubeaway_opt'))); } catch (e) {}
  O.zen = 0; O.inv = 0; O.sens = 100; O.rm = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 0;
  const saveO = () => { try { localStorage.setItem('cubeaway_opt', JSON.stringify(O)); } catch (e) {} };
  const glowEl = $('glow'), gctx = glowEl.getContext('2d'), g1 = document.createElement('canvas'), g2 = document.createElement('canvas');
  const c1 = g1.getContext('2d'), c2 = g2.getContext('2d');
  let glowOn = false, gf = 0, shotCv = null, shotPend = false, edgeMeshes = [];
  function glowSize() {
    const W = canvas.width, H = canvas.height;
    g1.width = Math.max(2, W >> 1); g1.height = Math.max(2, H >> 1); g2.width = Math.max(2, W >> 2); g2.height = Math.max(2, H >> 2);
    glowEl.width = Math.max(2, W >> 3); glowEl.height = Math.max(2, H >> 3);
  }
  function glowStep() {
    if (!glowOn) return;
    c1.drawImage(canvas, 0, 0, g1.width, g1.height); c2.drawImage(g1, 0, 0, g2.width, g2.height);
    gctx.globalCompositeOperation = 'source-over'; gctx.drawImage(g2, 0, 0, glowEl.width, glowEl.height);
    gctx.globalCompositeOperation = 'multiply'; gctx.drawImage(g2, 0, 0, glowEl.width, glowEl.height);   // ne garde que les zones vives
  }
  function takeShot() {   // aperçu du jeu pour l'image de partage
    const W = canvas.width, H = canvas.height, m = Math.min(W, H), c = document.createElement('canvas'); c.width = c.height = 700;
    c.getContext('2d').drawImage(canvas, (W - m) / 2, Math.max(0, (H - m) / 2 - H * 0.04), m, m, 0, 0, 700, 700);
    shotCv = c;
  }
  const Ads = {
    native: () => window.webkit && webkit.messageHandlers && webkit.messageHandlers.ads,
    isLoaded() { return Ads.native() ? !!window.__rewardedLoaded : true; },   // natif : appeler setRewardedLoaded(true/false)
    show(cb) {
      window.__rewardCb = cb;
      const mh = Ads.native();
      if (mh) { mh.postMessage('showRewarded'); return; }
      const m = document.createElement('div'); m.id = 'adMock';
      m.innerHTML = '<div><b>Vidéo récompensée</b><br>(simulation)<br><span id="adN">3</span></div>'; document.body.appendChild(m);
      let n = 3; const iv = setInterval(() => { n--; if (n <= 0) { clearInterval(iv); m.remove(); window.onRewardedVideoFinished(); } else $('adN').textContent = n; }, 1000);
    }
  };
  window.onRewardedVideoFinished = () => { const cb = window.__rewardCb; window.__rewardCb = null; if (cb) cb(); };   // natif : appeler à la fin de la vidéo
  window.setRewardedLoaded = v => { window.__rewardedLoaded = !!v; drawHints(); refreshLose(); };
  let boom = null;
  function explode() {
    if (O.rm) return false;
    const grp = new THREE.Group(), bg = new THREE.BoxGeometry(1, 1, 1), cols = COL.exit;
    for (let i = 0; i < 80; i++) {
      const a = ['x', 'y', 'z'][Math.floor(Math.random() * 3)], sg = Math.random() < 0.5 ? -1 : 1;
      const pos = new THREE.Vector3((Math.random() - 0.5) * DX, (Math.random() - 0.5) * DY, (Math.random() - 0.5) * DZ);
      pos[a] = sg * { x: DX, y: DY, z: DZ }[a] / 2;
      const m = new THREE.Mesh(bg, new THREE.MeshBasicMaterial({ color: cols[i % cols.length], transparent: true }));
      m.position.copy(pos); m.scale.setScalar(0.3 + Math.random() * 0.35);
      m.userData.v = pos.clone().normalize().multiplyScalar(2.5 + Math.random() * 4).add(new THREE.Vector3(0, 1.5, 0));
      m.userData.r = [Math.random() * 6, Math.random() * 6];
      grp.add(m);
    }
    grp.position.copy(cube.position); grp.quaternion.copy(cube.quaternion); grp.scale.copy(cube.scale);
    scene.add(grp); boom = { grp, t: 0 }; cube.visible = false;
    tone(300, 60, 0.5, 'sawtooth', 0.08); vib(40);
    return true;
  }
  function updBoom(dt) {
    if (!boom) return;
    boom.t += dt;
    boom.grp.children.forEach(m => { m.position.addScaledVector(m.userData.v, dt); m.userData.v.y -= 3 * dt; m.rotation.x += m.userData.r[0] * dt; m.rotation.y += m.userData.r[1] * dt; m.material.opacity = Math.max(0, 1 - boom.t / 1.1); });
    if (boom.t > 1.15) { scene.remove(boom.grp); boom.grp.children.forEach(m => m.material.dispose()); boom = null; }
  }
  // cube qui tourne sur l'accueil, derrière le logo
  const hcv = $('hcube'), hr = new THREE.WebGLRenderer({ canvas: hcv, alpha: true, antialias: true }), hs = new THREE.Scene(), hcam = new THREE.PerspectiveCamera(35, 1, 0.1, 50), hg = new THREE.Group();
  hr.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); hs.add(hg);
  let hbox = null, hedge = null, hw = 0, hh = 0;
  function hbuild() {
    if (hbox) { hbox.material.map.dispose(); hbox.material.map = tileTexture(); hbox.material.needsUpdate = true; hedge.material.color.set(THEMES[theme].edge); return; }

    for (let k = 0; k < seq.length - 1; k++) segN.push(seq[k].corner ? f.n : FACES[seq[k].fi].n);
    segN.push(f.n);
    const path = { group: g, mat, def, face: fi, alive: true, s: 0, rel: 0, bump: null, blocked: false, base, npts: pts.length, segN,
      segAbs: segN.map(n => new THREE.Vector3(Math.abs(n.x), Math.abs(n.y), Math.abs(n.z))), occ: [] };
    seq.forEach((q, ci) => { if (!q.corner) path.occ.push({ fi: q.fi, key: q.i * 16 + q.j, ci }); });
    path.d3 = new THREE.Vector3().addScaledVector(f.u, def.d[0]).addScaledVector(f.v, def.d[1]);
    for (let k = 0; k < pts.length - 1; k++) {
      const a = pts[k], b = pts[k + 1];
      const dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y), dz = Math.abs(a.z - b.z);
      const h = new THREE.Mesh(new THREE.BoxGeometry(dx + HW, dy + HW, dz + HW), hitMat);
      h.position.copy(a).add(b).multiplyScalar(0.5);
      h.userData.path = path; g.add(h); hits.push(h);
    }
    path.pts = pts.concat([pts[pts.length - 1].clone().addScaledVector(path.d3, 60)]);
    path.cum = [0];
    for (let i = 1; i < path.pts.length; i++) path.cum.push(path.cum[i - 1] + path.pts[i].distanceTo(path.pts[i - 1]));
    path.len = path.cum[pts.length - 1];
    path.cornerT = def.cont ? path.cum[def.cont.nodes.length] : null;
    path.segs = [];
    for (let i = 0; i < path.pts.length + 1; i++) { const m = new THREE.Mesh(UNIT, mat); g.add(m); path.segs.push(m); }
    path.cone = new THREE.Mesh(ARROW, mat);
    path.cone.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(path.d3.clone().cross(f.n), path.d3, f.n));
    g.add(path.cone);
    pose(path, 0);
    cube.add(g);
    return path;
  }

  function disposeObj(o) { o.traverse(c => { if (c.geometry && c.geometry !== UNIT && c.geometry !== ARROW && c.geometry !== SPARK && c.geometry !== DISC) c.geometry.dispose(); }); }

  function tileTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = THEMES[theme].tile; x.fillRect(0, 0, 256, 256);
    x.strokeStyle = THEMES[theme].line; x.lineWidth = 2;
    for (let n = 0; n < 26; n++) {
      let px = Math.floor(Math.random() * 16) * 16, py = Math.floor(Math.random() * 16) * 16;
      x.beginPath(); x.moveTo(px, py);
      for (let k = 0; k < 3; k++) { if (k % 2) py += (Math.random() < .5 ? -1 : 1) * 16 * (1 + Math.floor(Math.random() * 3)); else px += (Math.random() < .5 ? -1 : 1) * 16 * (1 + Math.floor(Math.random() * 3)); x.lineTo(px, py); }
      x.stroke(); x.beginPath(); x.arc(px, py, 3, 0, 6.283); x.stroke();
    }
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }

  // ---------- niveau ----------
  function build() {
    won = false; failed = false; lives = 3; hintObj = null;
    ['win', 'lose', 'settings'].forEach(id => $(id).classList.remove('show'));
    const L = mode === 'daily' ? daily.lvl : level;
    $('title').textContent = mode === 'daily' ? 'Défi du jour' : 'Niveau : ' + level;
    drawHearts(); drawHints(); updScore();
    while (cube.children.length) { const o = cube.children[0]; cube.remove(o); disposeObj(o); }
    shotPend = true; shotCv = null;
    cube.visible = true; if (boom) { scene.remove(boom.grp); boom = null; }
    hits = []; all = []; moving = []; bumping = []; flashing = []; fx = []; remaining = 0; rot = null;
    N = Math.min(12, 5 + Math.floor(L / 2)); [DX, DY, DZ] = shapeFor(L, N); N = Math.max(DX, DY, DZ); M = N - 1;
    const dens = Math.min(0.95, Math.min(0.8, 0.4 + 0.08 * L) + Math.max(0, L - 5) * 0.005);
    const ppf = Math.max(1, Math.round(M * M * dens / 4.5));
    const rand = rng(mode === 'daily' ? daily.seed : level * 7919 + 13);

    shell = new THREE.Mesh(new THREE.BoxGeometry(DX, DY, DZ), new THREE.MeshBasicMaterial({ map: tileTexture() }));
    cube.add(shell);
    edgeMeshes = [];
    const eb = edgeMat = new THREE.MeshBasicMaterial({ color: THEMES[theme].edge }), T = 0.045;
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      [[DX + T, T, T, 0, sx * DY / 2, sy * DZ / 2], [T, DY + T, T, sx * DX / 2, 0, sy * DZ / 2], [T, T, DZ + T, sx * DX / 2, sy * DY / 2, 0]].forEach(([w, h, d, x, y, z]) => {
        const m = new THREE.Mesh(UNIT, eb); m.scale.set(w, h, d); m.position.set(x, y, z); cube.add(m); edgeMeshes.push(m);
      });
    }

    occ = FACES.map(() => new Map());
    genAll(rand, ppf).forEach(def => {
      const p = makePath(def);
      all.push(p);
      p.occ.forEach(o => occ[o.fi].set(o.key, p));
      remaining++;
    });
    $('n').textContent = remaining;
    tm = 0; ts = 1; intro = O.rm ? 1 : 0; if (!O.rm) cube.scale.setScalar(0.01);
    tb.classList.remove('show'); if (mode === 'level' && level === 1 && tuto < 9) { tuto = 0; tutShow(0); }
    cube.quaternion.setFromEuler(new THREE.Euler(0.45, -0.6, 0));
    resize();
  }

  function blockerDistance(p) {
    const d = p.def.d, map = occ[p.face];
    const [a, b] = p.def.nodes[p.def.nodes.length - 1];
    let k = 1;
    while (true) {
      const x = a + d[0] * k, y = b + d[1] * k;
      if (x < 0 || y < 0 || x >= MU(FACES[p.face]) || y >= MV(FACES[p.face])) return 0;
      const o = map.get(x * 16 + y);
      if (o && o !== p) return k;
      k++;
    }
  }

  // flèche qui gêne p sur sa trajectoire de sortie (la première rencontrée)
  function blockerOf(p) {
    const d = p.def.d, map = occ[p.face];
    const [a, b] = p.def.nodes[p.def.nodes.length - 1];
    for (let k = 1; ; k++) {
      const x = a + d[0] * k, y = b + d[1] * k;
      if (x < 0 || y < 0 || x >= MU(FACES[p.face]) || y >= MV(FACES[p.face])) return null;
      const o = map.get(x * 16 + y);
      if (o && o !== p) return o;
    }
  }
  const FLASH = 0xffb000;
  function flashBlocker(q) {   // la flèche coupable clignote en ambre pour que l'erreur serve d'apprentissage
    if (!q || !q.alive || q.bump || (hintObj && hintObj.p === q)) return;
    q.fl = 0;
    if (!flashing.includes(q)) flashing.push(q);
  }

  // 2- trace pâle laissée sur la tuile
  function ghostOf(p) {
    const g = new THREE.Group();
    const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(p.col).lerp(new THREE.Color(theme === 'neon' ? 0x0d0f24 : 0xffffff), 0.65), transparent: true, opacity: 0.85 });
    for (let i = 0; i < p.npts - 1; i++) {
      const A = p.pts[i], B = p.pts[i + 1], ax = p.segAbs[i];
      const m = new THREE.Mesh(UNIT, mat);
      const cI = p.def.cont ? p.def.cont.nodes.length : -1;
      strip(m, A, B, i === cI ? 0 : SW / 2, i + 1 === cI ? 0 : SW / 2, ax, 0.01);
      m.position.addScaledVector(p.segN[i], -0.018);
      g.add(m);
    }
    cube.add(g);
    fx.push({ type: 'ghost', obj: g, mat, t: 0, dur: 1.0 });
  }
  // 6- reflet qui parcourt le corps, de la queue vers la pointe
  function glintOf(p) {
    const mat = new THREE.MeshBasicMaterial({ color: 0xd8e8ff, transparent: true, opacity: 0 });
    const m = new THREE.Mesh(DISC, mat);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), FACES[p.face].n);
    cube.add(m);
    fx.push({ type: 'glint', obj: m, mat, p, t: 0, dur: 0.3 });
  }
  // 3- boules émises depuis la queue, le long du tracé de la flèche
  function spawnBall(p) {
    const n = p.segN[segIndex(p, Math.max(0, p.s))];
    const mat = new THREE.MeshBasicMaterial({ color: p.col, transparent: true });
    const m = new THREE.Mesh(SPARK, mat);
    m.scale.setScalar(1.3);
    m.position.copy(pointAt(p, Math.max(0, p.s))).addScaledVector(n, 0.08);
    const v = p.d3.clone().cross(n).multiplyScalar((Math.random() - 0.5) * 0.6)
      .addScaledVector(n, 0.5 + Math.random() * 0.7);
    cube.add(m);
    fx.push({ type: 'ball', obj: m, mat, v, t: 0, dur: 0.55 });
  }
  // écho vert de la pointe qui glisse dans le sens de la sortie
  function echoOf(p, delay) {
    const mat = new THREE.MeshBasicMaterial({ color: COL.hint, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
    const m = new THREE.Mesh(ARROW, mat);
    m.quaternion.copy(p.cone.quaternion);
    m.position.copy(p.pts[p.npts - 1]);
    cube.add(m);
    fx.push({ type: 'echo', obj: m, mat, p, base: p.pts[p.npts - 1].clone(), delay, t: 0, dur: 0.8 });
  }
  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const e = fx[i];
      if (e.delay > 0) { e.delay -= dt; continue; }
      e.t += dt;
      const u = Math.min(1, e.t / e.dur);
      if (e.type === 'ghost') e.mat.opacity = 0.85 * (1 - u) * (1 - u);
      else if (e.type === 'glint') {
        const gt = e.p.s + e.p.len * u, gn = e.p.segN[segIndex(e.p, gt)];
        e.obj.position.copy(pointAt(e.p, gt)).addScaledVector(gn, 0.03);
        e.obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), gn);
        e.mat.opacity = 0.95 * Math.sin(Math.PI * u);
      } else if (e.type === 'echo') {
        e.obj.position.copy(e.base).addScaledVector(e.p.d3, 0.2 + 1.3 * u);
        e.mat.opacity = 0.75 * (1 - u);
      } else {
        e.obj.position.addScaledVector(e.v, dt);
        e.obj.scale.setScalar(1.3 * (1 - 0.7 * u));
        e.mat.opacity = 1 - u;
      }
      if (u >= 1) { cube.remove(e.obj); e.mat.dispose(); fx.splice(i, 1); }
    }
  }

  // ---------- indice ----------
  function clearHint() {
    if (!hintObj) return;
    if (hintObj.p.alive && !hintObj.p.bump) hintObj.p.mat.color.set(hintObj.p.blocked ? COL.bad : hintObj.p.base);
    hintObj = null;
  }
  function refreshBlocked() {
    for (const p of all) {
      if (p.alive && p.blocked && !p.bump && !blockerDistance(p)) {
        p.blocked = false;
        p.mat.color.set(hintObj && hintObj.p === p ? COL.hint : p.base);
      }
    }
  }
  function faceTo(p) {
    const nW = FACES[p.face].n.clone().applyQuaternion(cube.quaternion);
    const to = new THREE.Quaternion().setFromUnitVectors(nW, new THREE.Vector3(0, 0, 1)).multiply(cube.quaternion);
    rot = { from: cube.quaternion.clone(), to, t: 0 };
    vx = vy = 0;
  }
  // Indice : le 1er appui consomme l'indice et montre la flèche verte (le cube pivote vers sa face).
  // Les appuis suivants ne coûtent rien : ils ramènent seulement le cube sur la face de cette même flèche (sans son ni effet).
  function showHint(fromAd) {
    if (won || failed) return;
    if (hintObj) {
      if (hintObj.p.alive) { faceTo(hintObj.p); return; }   // 2e appui : seulement la face, aucun autre effet (la flèche verte clignote déjà)
      hintObj = null;
    }
    if (hints <= 0 && !fromAd) { if (Ads.isLoaded()) Ads.show(() => showHint(true)); return; }
    const camDir = camera.position.clone().sub(cube.position).normalize();
    let best = null, bs = -9;
    for (const p of all) {
      if (!p.alive || p.bump || blockerDistance(p)) continue;
      const sc = FACES[p.face].n.clone().applyQuaternion(cube.quaternion).dot(camDir);
      if (sc > bs) { bs = sc; best = p; }
    }
    if (!best) return;
    if (!fromAd) { hints = Math.max(0, hints - 1); drawHints(); }   // indice consommé dès l'affichage (une vidéo récompensée n'en consomme pas)
    tone(880, 1320, 0.12, 'sine', 0.12);
    best.blocked = false;
    best.mat.color.set(COL.hint);
    hintObj = { p: best, ring: 0 };
    faceTo(best);
  }

  // ---------- interaction ----------
  const ray = new THREE.Raycaster();
  function tap(cx, cy) {
    if (won || failed) return;
    const r = canvas.getBoundingClientRect();
    ray.setFromCamera({ x: ((cx - r.left) / r.width) * 2 - 1, y: -((cy - r.top) / r.height) * 2 + 1 }, camera);
    const hit = ray.intersectObjects([shell].concat(hits), false)[0];
    if (!hit) return 'void';
    if (hit.object === shell) return;
    const p = hit.object.userData.path;
    if (!p.alive || p.bump) return;
    const k = blockerDistance(p);
    if (k) {
      p.bump = { phase: 0, t: 0, max: Math.max(0.1, k - 0.68) };
      p.s = 0;
      const firstTime = !p.blocked;
      p.blocked = true;
      p.mat.color.set(COL.bad);
      bumping.push(p);
      flashBlocker(blockerOf(p));
      tone(160, 80, 0.18, 'square', 0.1); vib(firstTime ? 'error' : 'warning'); tutEv('bump');
      if (firstTime && !O.zen) {
        shake(); lives--; drawHearts();
        if (lives <= 0) { failed = true; tone(300, 100, 0.5, 'sawtooth', 0.1, 0.3); setTimeout(() => { refreshLose(); $('lose').classList.add('show'); }, 900); }
      }
      return;
    }
    if (hintObj && hintObj.p === p) hintObj = null;   // l'indice a déjà été consommé à l'affichage
    p.alive = false;
    p.col = COL.exit[Math.floor(Math.random() * COL.exit.length)];
    p.mat.color.set(p.col);
    hits = hits.filter(h => h.userData.path !== p);
    p.pre = 0.09;
    p.balls = 0;
    ghostOf(p); glintOf(p);
    moving.push(p);
    remaining--;
    $('n').textContent = remaining;
    pulseCount(); exitSound(); vib(Math.min(45, 12 + combo * 4)); tutEv('exit');
    if (remaining === 0 && !O.rm) { ts = 0.3; setTimeout(() => ts = 1, 450); }
  }

  // double-tap dans le vide : le cube revient à son orientation et à sa taille de départ
  function recenter() {
    if (won || failed || screen !== 'game') return;
    const to = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.45, -0.6, 0));
    rot = { from: cube.quaternion.clone(), to, t: 0, z0: zoom, z1: 1 };
    vx = vy = 0; tone(520, 780, 0.1, 'sine', 0.1); vib(10);
  }
  const AX = new THREE.Vector3(1, 0, 0), AY = new THREE.Vector3(0, 1, 0);
  let down = null, vx = 0, vy = 0, lastT = 0, rot = null, lastVoid = null;
  // Zoom à deux doigts (pincer) ou à la molette
  const ptrs = new Map();
  let pinch = null, zoom = 1;
  const setZoom = z => { zoom = Math.max(0.5, Math.min(1.8, z)); cube.scale.setScalar(zoom); };
  const pinchDist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    rot = null; audio();
    vx = vy = 0;
    if (ptrs.size === 2) { pinch = { d0: pinchDist(), z0: zoom }; down = null; return; }
    if (ptrs.size > 2) return;
    down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0, px: e.clientX, py: e.clientY };
    lastT = performance.now();
  });
  canvas.addEventListener('pointermove', e => {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch) { if (ptrs.size >= 2) setZoom(pinch.z0 * pinchDist() / pinch.d0); return; }
    if (!down) return;
    const dx = e.clientX - down.px, dy = e.clientY - down.py;
    down.px = e.clientX; down.py = e.clientY;
    down.moved += Math.abs(dx) + Math.abs(dy);
    if (down.moved > 20) tutEv('rot');
    const sg = (O.inv ? -1 : 1) * O.sens / 100, ay = dx * 0.01 * sg, ax = dy * 0.01 * sg;
    cube.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(AY, ay));
    cube.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(AX, ax));
    const now = performance.now(), dt = Math.max((now - lastT) / 1000, 0.008);
    lastT = now;
    vy = Math.max(-8, Math.min(8, ay / dt));
    vx = Math.max(-8, Math.min(8, ax / dt));
  });
  canvas.addEventListener('pointerup', e => {
    ptrs.delete(e.pointerId);
    if (pinch) { if (ptrs.size < 2) pinch = null; down = null; return; }
    if (!down) return;
    if (down.moved < 8 && performance.now() - down.t < 500) {
      vx = vy = 0;
      const r = tap(e.clientX, e.clientY), tn = performance.now();
      if (r === 'void') {
        if (lastVoid && tn - lastVoid.t < 350 && Math.hypot(e.clientX - lastVoid.x, e.clientY - lastVoid.y) < 60) { lastVoid = null; recenter(); }
        else lastVoid = { t: tn, x: e.clientX, y: e.clientY };
      } else lastVoid = null;
    }
    down = null;
  });
  canvas.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; down = null; });
  canvas.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.08 : 0.93)); }, { passive: false });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.position.set(0, 0, CFG.camDist * N / Math.min(1, camera.aspect));
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    cube.position.y = camera.aspect < 1 ? N * 0.1 : 0;
    glowSize();
  }
  window.addEventListener('resize', resize);

  // ---------- boucle ----------
  let prev = performance.now();
  function frame(now) {
    const rdt = Math.min(0.05, (now - prev) / 1000), dt = rdt * ts;
    prev = now;
    if (screen === 'game' && !won && !failed && !document.querySelector('.ov.show')) tm += rdt;
    if (intro < 1) { intro = Math.min(1, intro + rdt / 0.55); const q = intro - 1; cube.scale.setScalar(zoom * (1 + 2.70158 * q * q * q + 1.70158 * q * q)); }

    if (rot) {
      rot.t = Math.min(1, rot.t + dt / 0.4);
      const ez = 1 - Math.pow(1 - rot.t, 3);
      cube.quaternion.copy(rot.from).slerp(rot.to, ez);
      if (rot.z1 !== undefined && intro >= 1) setZoom(rot.z0 + (rot.z1 - rot.z0) * ez);
      if (rot.t >= 1) rot = null;
    }
    if (!down && (Math.abs(vx) > 0.01 || Math.abs(vy) > 0.01)) {
      cube.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(AY, vy * dt));
      cube.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(AX, vx * dt));
      const k = Math.pow(0.05, dt);
      vx *= k; vy *= k;
    }

    let freed = false;
    for (let i = moving.length - 1; i >= 0; i--) {
      const p = moving[i];
      if (p.pre > 0) {
        p.pre -= dt;
        p.s = -0.15 * Math.sin(Math.PI / 2 * Math.min(1, (0.09 - p.pre) / 0.09));
        pose(p, p.s);
        continue;
      }
      p.s += dt * (CFG.exitBase + CFG.exitAccel * Math.max(0, p.s));
      while (p.rel < p.occ.length && p.cum[p.occ[p.rel].ci] <= p.s) {
        const o = p.occ[p.rel];
        occ[o.fi].delete(o.key);
        p.rel++; freed = true;
      }
      pose(p, p.s);
      while (p.balls < 9 && p.s >= p.balls * 0.25) { spawnBall(p); p.balls++; }
      const end = p.len + N + 6;
      p.mat.opacity = 1 - Math.max(0, (p.s / end - 0.8) / 0.2);
      if (p.s >= end) { cube.remove(p.group); disposeObj(p.group); moving.splice(i, 1); }
    }

    if (freed) refreshBlocked();

    for (let i = bumping.length - 1; i >= 0; i--) {
      const p = bumping[i], bp = p.bump;
      if (bp.phase === 0) {
        p.s = Math.min(bp.max, p.s + dt * CFG.bumpFwd);
        pose(p, p.s);
        if (p.s >= bp.max) { bp.phase = 1; bp.t = 0; }
      } else if (bp.phase === 1) {
        bp.t += dt;
        pose(p, bp.max - 0.06 * (0.5 + 0.5 * Math.sin(bp.t * 60)));
        if (bp.t > 0.2) { bp.phase = 2; p.s = bp.max; }
      } else {
        p.s = Math.max(0, p.s - dt * CFG.bumpBack);
        pose(p, p.s);
        if (p.s <= 0) { p.bump = null; bumping.splice(i, 1); }
      }
    }

    for (let i = flashing.length - 1; i >= 0; i--) {
      const q = flashing[i]; q.fl += rdt;
      if (!q.alive || q.bump || (hintObj && hintObj.p === q)) { flashing.splice(i, 1); continue; }
      const rest = q.blocked ? COL.bad : q.base;
      if (q.fl >= 0.75) { q.mat.color.set(rest); flashing.splice(i, 1); continue; }
      q.mat.color.set(O.rm || Math.floor(q.fl / 0.125) % 2 === 0 ? FLASH : rest);   // 3 clignotements (fixe si mouvement réduit)
    }
    if (hintObj) {
      const hp = hintObj.p;
      if (hp.alive && !hp.bump) hp.mat.color.set(COL.hint).lerp(WHITE, 0.4 * (0.5 + 0.5 * Math.sin(now * 0.007)));

    e.target.value = '';
  };
  $('frz').onclick = () => toast('Gel de série ❄️ : un jour manqué consomme un gel au lieu de remettre la série à zéro. +1 gel tous les 7 jours (max 2).');
  // liste défilante des défis : doigt, glisser à la souris, molette ou trackpad + pastilles
  const row = $('dRow'), cards = [...row.querySelectorAll('#daily,.chal')];
  cards.forEach(() => $('dots').appendChild(document.createElement('span')));
  function dotsUpd() {
    const r = row.getBoundingClientRect(), c = r.left + r.width / 2; let bi = 0, bd = 1e9;
    cards.forEach((el, i) => { const b = el.getBoundingClientRect(), d = Math.abs(b.left + b.width / 2 - c); if (d < bd) { bd = d; bi = i; } });
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === bi));
  }
  row.addEventListener('scroll', dotsUpd, { passive: true });
  let dn = null, dm = 0;
  row.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') { dn = { x: e.clientX, sl: row.scrollLeft }; dm = 0; } });
  window.addEventListener('pointermove', e => { if (!dn) return; const dx = e.clientX - dn.x; dm = Math.max(dm, Math.abs(dx)); row.style.scrollSnapType = 'none'; row.scrollLeft = dn.sl - dx; });
  window.addEventListener('pointerup', () => { if (!dn) return; dn = null; row.style.scrollSnapType = ''; });
  row.addEventListener('click', e => { if (dm > 6) { e.stopPropagation(); e.preventDefault(); dm = 0; } }, true);
  row.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { row.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  applyLang();
  document.querySelectorAll('.chal').forEach((el, i) => el.addEventListener('click', () => toast('Fais le défi du jour ' + CH[i][0] + ' jours de suite : +' + CH[i][1] + ' indices (un jour manqué consomme un gel ❄️)')));
  drawHints();
  resize();
  showHome();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
